[project]
name = "APIdoc"
version = "0.1.0"
description = "Diagnose failing API calls: re-run with a trace, explain why it failed, export a fixed request."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.5"]

[project.scripts]
apidoc = "apidoc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apidoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D100"]

[tool.ruff.lint.isort]
known-first-party = ["apidoc", "mock_server", "evals"]

[tool.ruff.lint.per-file-ignores]
"evals/*.py" = ["E402"]
"tests/*.py" = ["D100"]
